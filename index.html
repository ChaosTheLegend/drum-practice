<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0d0e10">
  <meta name="description" content="Personal drum practice tracker: training program, practice log, BPM progress and assessments.">
  <title>Drum Practice</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cellipse cx='16' cy='11' rx='12' ry='5' fill='%23d64545'/%3E%3Cpath d='M4 11v10c0 2.8 5.4 5 12 5s12-2.2 12-5V11' fill='none' stroke='%23e8e6e3' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/"><span class="brand-mark" aria-hidden="true"></span>Drum Practice</a>
    <nav class="nav" aria-label="Main">
      <a href="#/">Today</a>
      <a href="#/program">Program</a>
      <a href="#/log">Log</a>
      <a href="#/progress">BPM</a>
      <a href="#/assess">Assess</a>
      <a href="#/stats">Stats</a>
      <a href="#/library">Library</a>
      <a href="#/settings">Settings</a>
    </nav>
  </header>
  <div id="timer" class="timer" hidden>
    <span class="timer-dot" aria-hidden="true"></span>
    <span>Session running</span>
    <strong class="timer-clock" aria-live="off">0:00</strong>
    <button class="btn btn-sm" data-action="finish-session">Finish & log</button>
    <button class="btn btn-ghost btn-sm" data-action="cancel-session">Discard</button>
  </div>
  <main id="view" class="container"></main>
  <noscript><p class="container">This app needs JavaScript.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
